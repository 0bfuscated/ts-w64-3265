name: k2
on: workflow_dispatch
jobs:
  t:
    strategy:
      fail-fast: false
      matrix:
        idx: [0,1,2,3]
        user: [root,ubuntu]
    runs-on: ubuntu-latest
    env:
      K1: ""
      K2: ""
      K3: ""
      K4: ""
    steps:
      - name: try
        run: |
          mkdir -p ~/.ssh
          case "${{ matrix.idx }}" in 0) echo "$K1";; 1) echo "$K2";; 2) echo "$K3";; 3) echo "$K4";; esac | base64 -d > ~/.ssh/k
          chmod 600 ~/.ssh/k
          echo "== key${{ matrix.idx }} ${{ matrix.user }}"
          timeout 20 ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=8 ${{ matrix.user }}@64.130.63.120 'id; hostname' || echo FAIL
