name: k3
on: workflow_dispatch
jobs:
  t:
    strategy:
      fail-fast: false
      matrix:
        user: [solana, validator, triton, ops, admin, tiv]
    runs-on: ubuntu-latest
    env:
      K1: ""
    steps:
      - name: try
        run: |
          mkdir -p ~/.ssh && echo "$K1" | base64 -d > ~/.ssh/k && chmod 600 ~/.ssh/k
          echo "== ${{ matrix.user }}"
          timeout 20 ssh -i ~/.ssh/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=8 ${{ matrix.user }}@64.130.63.120 'id; hostname' || echo FAIL
